<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VSheng · 星空主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #fff;
    }
    canvas { display: block; }
    .card {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(90vw, 560px);
      padding: 38px 40px;
      border-radius: 22px;
      background: rgba(15, 23, 42, 0.48);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      text-align: center;
      pointer-events: none;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .tag {
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      color: #94a3b8;
      margin-bottom: 14px;
      text-transform: uppercase;
    }
    h1 {
      font-size: clamp(1.4rem, 3.6vw, 2.1rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.5;
      background: linear-gradient(90deg, #fde047, #f472b6, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
    }
    .game-btn {
      pointer-events: auto;
      display: inline-block;
      margin: 6px 0 18px;
      padding: 12px 28px;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      box-shadow: 0 8px 24px rgba(236, 72, 153, 0.4);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .game-btn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 12px 30px rgba(236, 72, 153, 0.6);
    }
    .game-btn:active {
      transform: scale(0.97);
    }
    .tip { font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="card">
    <div class="tag">VSheng</div>
    <h1>怕输一世难出头，<br>求稳一辈难封侯。</h1>
    <a class="game-btn" href="./game.html" onclick="event.stopPropagation()">🎮 进入《疯狂找杂物》</a>
    <p class="tip">移动鼠标吸引星光 · 点击任意位置绽放烟花</p>
  </div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });

    const mouse = { x: -999, y: -999 };
    const particles = [];
    const colors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#facc15'];

    for (let i = 0; i < 90; i++) {
      particles.push({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8,
        r: Math.random() * 2 + 1,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: Infinity
      });
    }

    function burst(x, y) {
      for (let i = 0; i < 36; i++) {
        const angle = (Math.PI * 2 * i) / 36 + Math.random() * 0.2;
        const speed = Math.random() * 5 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          r: Math.random() * 2.5 + 1.5,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 70
        });
      }
    }

    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('click', e => burst(e.clientX, e.clientY));
    window.addEventListener('touchstart', e => {
      if (e.target.closest('.game-btn')) return;
      const t = e.touches[0];
      burst(t.clientX, t.clientY);
    });

    function loop() {
      ctx.fillStyle = 'rgba(2, 6, 23, 0.2)';
      ctx.fillRect(0, 0, w, h);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.life === Infinity) {
          const dx = mouse.x - p.x, dy = mouse.y - p.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 140) { p.vx += dx * 0.0004; p.vy += dy * 0.0004; }
          p.vx *= 0.99; p.vy *= 0.99;
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;
        } else {
          p.vx *= 0.96; p.vy *= 0.96; p.vy += 0.04;
          p.life--;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
        }
        p.x += p.vx; p.y += p.vy;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
